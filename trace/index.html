<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Hard boundary: the browser is FORBIDDEN from reaching anything but this
       origin. 'self' only; no inline script/style (enforces Tailwind-free,
       token-driven CSS and DOM-built scripts); data: images for the favicon. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; manifest-src 'self'" />
  <meta name="referrer" content="no-referrer" />

  <title>TRACE — Internet Contamination Observatory</title>
  <meta name="description" content="TRACE renders a certified public bundle of internet-contamination lineage evidence. A forensic methodology — claims, sourced lineage edges, and provenance kept separate. Methodology, not accusation." />
  <meta name="robots" content="index,follow" />
  <meta name="color-scheme" content="dark" />

  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2024%2024'%3E%3Crect%20width='24'%20height='24'%20fill='%23070a0e'/%3E%3Ccircle%20cx='12'%20cy='12'%20r='8'%20fill='none'%20stroke='%236ea8d8'%20stroke-width='1.6'/%3E%3Cpath%20d='M12%202v4M12%2018v4M2%2012h4M18%2012h4'%20stroke='%236ea8d8'%20stroke-width='1.6'/%3E%3Ccircle%20cx='12'%20cy='12'%20r='2'%20fill='%236ea8d8'/%3E%3C/svg%3E" />

  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <div class="sample-banner" id="sample-banner" hidden></div>

  <main class="shell" id="main">
    <div id="header-mount"></div>

    <nav class="viewnav" id="view-nav" role="tablist" aria-label="Observatory views"></nav>

    <section class="panel" id="view-timeline" role="tabpanel" aria-labelledby="tab-timeline" tabindex="0"></section>
    <section class="panel" id="view-graph" role="tabpanel" aria-labelledby="tab-graph" tabindex="0" hidden></section>
    <section class="panel" id="view-sources" role="tabpanel" aria-labelledby="tab-sources" tabindex="0" hidden></section>

    <footer class="foot">
      <span>TRACE Observatory · static forensic artifact · reads one same-origin bundle</span>
      <span>swarm.skinny.cloud · methodology, not accusation</span>
    </footer>
  </main>

  <!-- Detail drawer -->
  <div class="scrim" id="scrim" data-testid="scrim" hidden></div>
  <aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title" data-testid="detail-drawer" hidden>
    <div class="drawer__head">
      <div>
        <div class="drawer__kicker" id="drawer-kicker"></div>
        <h2 class="drawer__title" id="drawer-title"></h2>
      </div>
      <button type="button" class="drawer__close" id="drawer-close" data-testid="drawer-close" aria-label="Close detail">
        <span class="icon" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg></span>
      </button>
    </div>
    <div class="drawer__body" id="drawer-body"></div>
  </aside>

  <noscript>
    <div class="shell noscript-shell">
      <div class="state state--error">
        <h3>JavaScript is required</h3>
        <p>This observatory renders a local evidence bundle in the browser. Enable JavaScript to view the timeline, graph, and source ledger. No external scripts are loaded — everything is same-origin and static.</p>
      </div>
    </div>
  </noscript>

  <script type="module" src="js/app.js"></script>
</body>
</html>
